<!DOCTYPE html>
<!--
  HTML shell for the web build. Because web.output is "single", Expo fills this
  file's placeholders rather than rendering an app/+html.tsx component, and it
  injects the theme-color and description meta tags from expo.web in app.json.
  Expo substitutes each placeholder token only once, so do not repeat the two
  tokens below anywhere else in this file — including in comments.

  The manifest and icon hrefs are root-absolute so they resolve from any route;
  .github/workflows/deploy-web.yml rewrites them for the /ComotV2/app subpath.
-->
<!-- dir is Hebrew-first to match the product; src/lib/i18n.ts corrects it for English. -->
<html lang="%LANG_ISO_CODE%" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets safe-area insets reach the notch and home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>

    <!-- Home-screen install. iOS Safari reads the apple-* tags; iOS 17+ also reads the manifest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ComOt" />
    <meta name="application-name" content="ComOt" />
    <link rel="apple-touch-icon" sizes="1024x1024" href="/icons/icon-1024.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Matches colors.bgSoft so the launch screen does not flash white. */
      html,
      body {
        background-color: #f8f9fb;
      }
      /* Suppresses rubber-band scrolling, which feels broken in standalone mode. */
      body {
        overscroll-behavior-y: none;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
