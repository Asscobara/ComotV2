name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  database:
    name: Schema & RLS smoke tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration and run smoke tests
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "create database comot_test"
          psql -h localhost -U postgres -d comot_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/setup.sql \
            -f supabase/migrations/0001_init.sql \
            -f supabase/migrations/0002_chat_faults.sql \
            -f supabase/migrations/0003_events_polls_budget.sql \
            -f supabase/migrations/0004_vendors.sql \
            -f supabase/migrations/0005_notifications.sql \
            -f supabase/tests/smoke.sql \
            -f supabase/tests/smoke2.sql \
            -f supabase/tests/smoke3.sql \
            -f supabase/tests/smoke4.sql \
            -f supabase/tests/smoke5.sql
