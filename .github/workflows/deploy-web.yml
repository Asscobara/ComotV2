name: Deploy Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build app for the /ComotV2/app subpath
        working-directory: apps/mobile
        run: |
          node -e "
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            a.expo.experiments = { ...a.expo.experiments, baseUrl: '/ComotV2/app' };
            fs.writeFileSync('app.json', JSON.stringify(a, null, 2));
          "
          pnpm exec expo export --platform web

      - name: Assemble site (landing at /, app at /app/)
        run: |
          mkdir -p site/app
          cp -r apps/landing/. site/
          cp -r apps/mobile/dist/. site/app/
          # SPA fallback: GitHub Pages serves the root 404.html for every unknown
          # path, so we use the app shell there to make app deep links work.
          cp site/app/index.html site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
